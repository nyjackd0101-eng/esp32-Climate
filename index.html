<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere Dashboard</title>
    <style>
        :root {
            font-family: Consolas, 'Lucida Console', Monaco, Menlo, 'SF Mono', monospace;
            color: #111;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-width: 320px;
            min-height: 100vh;
            color: #111;
            position: relative;
            overflow-x: hidden;
            background-color: #f7f6f2;
        }

        /* Fixed Background Photo with Airy Gradient Wash */
        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(180deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.38) 55%, rgba(255, 255, 255, 0.48) 100%),
                url('assets/background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        /* Scrollable Leaves Layer: Moves with Content on Desktop & Mobile */
        .leaves-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-leaf {
            position: absolute;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.14));
            opacity: 0.94;
        }

        /* Content Shell */
        .dashboard-shell {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .dashboard-content {
            width: min(1080px, calc(100% - 64px));
            margin: auto;
            padding: 48px 0;
        }

        .label, .trend, .location {
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0;
        }

        .intro {
            padding: 24px 0 42px;
        }

        .intro-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        h2 {
            font-size: clamp(38px, 6vw, 72px);
            line-height: 1.02;
            font-weight: 400;
            letter-spacing: -.06em;
            margin: 0;
        }

        .location {
            color: #222;
            line-height: 1.6;
            padding-bottom: 6px;
        }

        /* Translucent Glassmorphic Cards */
        .readings {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .reading {
            position: relative;
            min-height: 255px;
            padding: 22px 20px 18px;
            border: 1px solid rgba(17, 17, 17, 0.65);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s, border-color 0.3s;
        }

        .reading:hover {
            background: rgba(255, 255, 255, 0.58);
        }

        .label {
            color: #111;
            font-size: 15px;
            letter-spacing: -.02em;
            text-transform: none;
        }

        .value {
            margin: 18px 0 22px;
            font-size: clamp(28px, 3.6vw, 44px);
            line-height: 1;
            letter-spacing: -.06em;
            font-weight: 500;
        }

        .unit {
            color: #111;
            font-size: 0.65em;
            font-weight: normal;
            margin-left: 6px;
        }

        .trend {
            color: #333;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 820px) {
            .dashboard-content { width: min(100% - 32px, 600px); padding: 32px 0; }
            .readings { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .readings { grid-template-columns: 1fr; }
            .reading { min-height: 210px; }
        }

        /* Timeframe Controls */
        .time-controls { display: flex; gap: 8px; margin-top: 22px; }
        .time-btn {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid #111;
            border-radius: 5px;
            color: #111;
            padding: 7px 15px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-btn:hover { background: rgba(255, 255, 255, 0.85); }
        .time-btn.active { background: #111; border-color: #111; color: #fff; font-weight: bold; }

        /* SVG Charts */
        .mini-chart { display: block; width: 100%; height: 68px; overflow: visible; margin-top: 14px; }
        .chart-grid { stroke: rgba(17, 17, 17, 0.22); stroke-width: 1; stroke-dasharray: 2 3; }
        .chart-line { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .chart-dot { fill: #111; stroke: #fff; stroke-width: 1.5; transition: cy 0.3s ease; }
        .chart-axis {
            display: flex;
            justify-content: space-between;
            color: #222;
            font-size: 10px;
            letter-spacing: .04em;
            margin-top: 10px;
            border-top: 1px solid rgba(17, 17, 17, 0.25);
            padding-top: 8px;
        }

        /* Hover Tooltips */
        .crosshair { stroke: #111; stroke-width: 1; stroke-dasharray: 2 2; opacity: 0; pointer-events: none; }
        .hover-target { cursor: crosshair; }
        .chart-tooltip {
            position: absolute;
            opacity: 0;
            background: #111;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            transform: translate(-50%, -120%);
            text-align: center;
            z-index: 20;
            transition: opacity 0.1s ease;
        }
        .tooltip-val { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
        .tooltip-time { color: #bbb; font-size: 8px; letter-spacing: .05em; text-transform: uppercase; }

        /* Dynamic Alerts */
        .reading.alert-warning { background: rgba(255, 243, 205, 0.65); }
        .reading.alert-danger { background: rgba(254, 226, 226, 0.72); }
        .reading.alert-danger .value, .reading.alert-danger .label, .reading.alert-danger .unit { color: #dc2626; }
        .reading.alert-danger .chart-line { stroke: #dc2626; }
    </style>
</head>
<body>

    <!-- Fixed Background Image + Light Wash Layer -->
    <div class="bg-fixed" aria-hidden="true"></div>

    <!-- Scrollable Scattered Leaves Layer (moves with page content) -->
    <div class="leaves-layer" id="leaves-container" aria-hidden="true"></div>

    <main class="dashboard-shell">
        <div class="dashboard-content">

            <section class="intro" aria-labelledby="overview-title">
                <div class="intro-header">
                    <h2 id="overview-title">The air around you,<br>in real time.</h2>
                    <p class="location" id="last-synced">INDOOR<br>STUDIO 01 · SYNCING LIVE DATA...</p>
                </div>
                
                <div class="time-controls">
                    <button class="time-btn" onclick="setTimeframe(60, this)">1H</button>
                    <button class="time-btn active" onclick="setTimeframe(360, this)">6H</button>
                    <button class="time-btn" onclick="setTimeframe(1440, this)">24H</button>
                    <button class="time-btn" onclick="setTimeframe(10080, this)">7D</button>
                </div>
            </section>

            <section class="readings" aria-label="Current air quality readings">
                
                <!-- CARD 1: TEMPERATURE -->
                <article class="reading" id="card-temp">
                    <p class="label">Temperature</p>
                    <p class="value"><span id="val-temp">--</span><span class="unit">°F</span></p>
                    <p class="trend"><span class="trend-label">6H TREND</span> <b id="trend-temp">LIVE</b></p>
                    
                    <div class="chart-tooltip" id="tip-temp">
                        <div class="tooltip-val">--</div>
                        <div class="tooltip-time">--</div>
                    </div>
                    
                    <svg class="mini-chart" viewBox="0 0 360 60" preserveAspectRatio="none">
                        <path class="chart-grid" d="M0 15H360M0 30H360M0 45H360 M72 0V60 M144 0V60 M216 0V60 M288 0V60" />
                        <polyline id="poly-temp" class="chart-line" points="" />
                        <line id="cross-temp" class="crosshair" x1="0" y1="0" x2="0" y2="60" />
                        <circle id="dot-temp" class="chart-dot" cx="360" cy="30" r="3" opacity="0" />
                        <rect class="hover-target" x="0" y="0" width="360" height="60" fill="transparent" 
                              onmousemove="handleHover(event, 'temp', 'field1', '°F')" 
                              onmouseleave="hideHover('temp')" 
                              ontouchmove="handleHover(event, 'temp', 'field1', '°F')" 
                              ontouchend="hideHover('temp')" />
                    </svg>
                    <div class="chart-axis" id="axis-temp"><span>-6H</span><span>-4H</span><span>-2H</span><span>NOW</span></div>
                </article>

                <!-- CARD 2: HUMIDITY -->
                <article class="reading" id="card-hum">
                    <p class="label">Humidity</p>
                    <p class="value"><span id="val-hum">--</span><span class="unit">%</span></p>
                    <p class="trend"><span class="trend-label">6H TREND</span> <b id="trend-hum">LIVE</b></p>
                    
                    <div class="chart-tooltip" id="tip-hum">
                        <div class="tooltip-val">--</div>
                        <div class="tooltip-time">--</div>
                    </div>
                    
                    <svg class="mini-chart" viewBox="0 0 360 60" preserveAspectRatio="none">
                        <path class="chart-grid" d="M0 15H360M0 30H360M0 45H360 M72 0V60 M144 0V60 M216 0V60 M288 0V60" />
                        <polyline id="poly-hum" class="chart-line" points="" />
                        <line id="cross-hum" class="crosshair" x1="0" y1="0" x2="0" y2="60" />
                        <circle id="dot-hum" class="chart-dot" cx="360" cy="30" r="3" opacity="0" />
                        <rect class="hover-target" x="0" y="0" width="360" height="60" fill="transparent" 
                              onmousemove="handleHover(event, 'hum', 'field2', '%')" 
                              onmouseleave="hideHover('hum')" 
                              ontouchmove="handleHover(event, 'hum', 'field2', '%')" 
                              ontouchend="hideHover('hum')" />
                    </svg>
                    <div class="chart-axis" id="axis-hum"><span>-6H</span><span>-4H</span><span>-2H</span><span>NOW</span></div>
                </article>

                <!-- CARD 3: PRESSURE -->
                <article class="reading" id="card-pres">
                    <p class="label">Pressure</p>
                    <p class="value"><span id="val-pres">--</span><span class="unit">hPa</span></p>
                    <p class="trend"><span class="trend-label">6H TREND</span> <b id="trend-pres">LIVE</b></p>
                    
                    <div class="chart-tooltip" id="tip-pres">
                        <div class="tooltip-val">--</div>
                        <div class="tooltip-time">--</div>
                    </div>
                    
                    <svg class="mini-chart" viewBox="0 0 360 60" preserveAspectRatio="none">
                        <path class="chart-grid" d="M0 15H360M0 30H360M0 45H360 M72 0V60 M144 0V60 M216 0V60 M288 0V60" />
                        <polyline id="poly-pres" class="chart-line" points="" />
                        <line id="cross-pres" class="crosshair" x1="0" y1="0" x2="0" y2="60" />
                        <circle id="dot-pres" class="chart-dot" cx="360" cy="30" r="3" opacity="0" />
                        <rect class="hover-target" x="0" y="0" width="360" height="60" fill="transparent" 
                              onmousemove="handleHover(event, 'pres', 'field3', 'hPa')" 
                              onmouseleave="hideHover('pres')" 
                              ontouchmove="handleHover(event, 'pres', 'field3', 'hPa')" 
                              ontouchend="hideHover('pres')" />
                    </svg>
                    <div class="chart-axis" id="axis-pres"><span>-6H</span><span>-4H</span><span>-2H</span><span>NOW</span></div>
                </article>

                <!-- CARD 4: VOC GAS -->
                <article class="reading" id="card-voc">
                    <p class="label">VOC Gas Status</p>
                    <p class="value"><span id="val-voc">--</span><span class="unit" id="val-voc-raw"></span></p>
                    <p class="trend"><span class="trend-label">6H TREND</span> <b id="trend-voc">LIVE</b></p>
                    
                    <div class="chart-tooltip" id="tip-voc">
                        <div class="tooltip-val">--</div>
                        <div class="tooltip-time">--</div>
                    </div>
                    
                    <svg class="mini-chart" viewBox="0 0 360 60" preserveAspectRatio="none">
                        <path class="chart-grid" d="M0 15H360M0 30H360M0 45H360 M72 0V60 M144 0V60 M216 0V60 M288 0V60" />
                        <polyline id="poly-voc" class="chart-line" points="" />
                        <line id="cross-voc" class="crosshair" x1="0" y1="0" x2="0" y2="60" />
                        <circle id="dot-voc" class="chart-dot" cx="360" cy="30" r="3" opacity="0" />
                        <rect class="hover-target" x="0" y="0" width="360" height="60" fill="transparent" 
                              onmousemove="handleHover(event, 'voc', 'field4', 'kΩ')" 
                              onmouseleave="hideHover('voc')" 
                              ontouchmove="handleHover(event, 'voc', 'field4', 'kΩ')" 
                              ontouchend="hideHover('voc')" />
                    </svg>
                    <div class="chart-axis" id="axis-voc"><span>-6H</span><span>-4H</span><span>-2H</span><span>NOW</span></div>
                </article>

            </section>
        </div>
    </main>

    <script>
        const leafSprites = [
            "assets/leaf-1.png",
            "assets/leaf-2.png",
            "assets/leaf-3.png",
            "assets/leaf-4.png"
        ];

        function scatterLeaves() {
            const container = document.getElementById('leaves-container');
            container.innerHTML = '';

            // Distributed along the entire page height so they scroll with the content
            const zones = [
                { topMin: 4,  topMax: 16, leftMin: -2, leftMax: 6,  sizeMin: 125, sizeMax: 165 },
                { topMin: 22, topMax: 34, leftMin: 88, leftMax: 95, sizeMin: 130, sizeMax: 170 },
                { topMin: 42, topMax: 54, leftMin: 42, leftMax: 50, sizeMin: 115, sizeMax: 150 },
                { topMin: 62, topMax: 74, leftMin: -3, leftMax: 5,  sizeMin: 130, sizeMax: 175 },
                { topMin: 78, topMax: 88, leftMin: 88, leftMax: 94, sizeMin: 135, sizeMax: 180 },
                { topMin: 90, topMax: 96, leftMin: 50, leftMax: 65, sizeMin: 120, sizeMax: 160 }
            ];

            zones.forEach((z, idx) => {
                const img = document.createElement('img');
                img.src = leafSprites[idx % leafSprites.length];
                img.className = 'floating-leaf';

                const top = z.topMin + Math.random() * (z.topMax - z.topMin);
                const left = z.leftMin + Math.random() * (z.leftMax - z.leftMin);
                const size = z.sizeMin + Math.random() * (z.sizeMax - z.sizeMin);
                const rot = Math.round(Math.random() * 360);

                img.style.top = `${top.toFixed(1)}%`;
                img.style.left = `${left.toFixed(1)}%`;
                img.style.width = `${Math.round(size)}px`;
                img.style.transform = `rotate(${rot}deg)`;

                container.appendChild(img);
            });
        }

        scatterLeaves();

        const channelID = "3533182"; 
        const readAPIKey = "Z60FSMP5NL35597N";

        let currentMinutes = 360; 
        let globalFeedData = [];  

        function setTimeframe(minutes, btnElement) {
            currentMinutes = minutes;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            let labels = [];
            if(minutes === 60) labels = ['-60M', '-40M', '-20M', 'NOW'];
            else if(minutes === 360) labels = ['-6H', '-4H', '-2H', 'NOW'];
            else if(minutes === 1440) labels = ['-24H', '-16H', '-8H', 'NOW'];
            else labels = ['-7D', '-5D', '-2D', 'NOW'];
            
            ['temp', 'hum', 'pres', 'voc'].forEach(id => {
                const axis = document.getElementById(`axis-${id}`);
                axis.innerHTML = `<span>${labels[0]}</span><span>${labels[1]}</span><span>${labels[2]}</span><span>${labels[3]}</span>`;
                
                const labelStr = (minutes === 60) ? "1H" : (minutes === 360) ? "6H" : (minutes === 1440) ? "24H" : "7D";
                document.querySelector(`#card-${id} .trend-label`).innerText = `${labelStr} TREND`;
            });

            fetchData();
        }

        function handleHover(event, id, fieldKey, unit) {
            if (!globalFeedData.length) return;
            
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const validData = globalFeedData.filter(d => d[fieldKey] !== null);
            if (!validData.length) return;

            const rect = event.target.getBoundingClientRect();
            let percentX = (clientX - rect.left) / rect.width;
            if (percentX < 0) percentX = 0;
            if (percentX > 1) percentX = 1;

            const index = Math.round(percentX * (validData.length - 1));
            const dataPoint = validData[index];
            const val = parseFloat(dataPoint[fieldKey]);

            let valStr = val.toFixed(1) + unit;
            if (id === 'pres') valStr = val.toFixed(0) + unit;
            if (id === 'voc') valStr = (val/1000).toFixed(1) + unit;

            const date = new Date(dataPoint.created_at);
            const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', month: 'short', day: 'numeric'});

            const crossX = percentX * 360; 
            const crosshair = document.getElementById(`cross-${id}`);
            crosshair.setAttribute('x1', crossX);
            crosshair.setAttribute('x2', crossX);
            crosshair.style.opacity = '1';

            const tooltip = document.getElementById(`tip-${id}`);
            tooltip.querySelector('.tooltip-val').innerText = valStr;
            tooltip.querySelector('.tooltip-time').innerText = timeStr;
            
            const cardRect = document.getElementById(`card-${id}`).getBoundingClientRect();
            const relativeX = (clientX - cardRect.left);
            const relativeY = (rect.top - cardRect.top) + 15; 
            
            tooltip.style.left = `${relativeX}px`;
            tooltip.style.top = `${relativeY}px`;
            tooltip.style.opacity = '1';
        }

        function hideHover(id) {
            document.getElementById(`cross-${id}`).style.opacity = '0';
            document.getElementById(`tip-${id}`).style.opacity = '0';
        }

        function getGasStatus(gasOhms) {
            if (gasOhms > 50000) return "GOOD";
            if (gasOhms > 10000) return "FAIR";
            return "POOR";
        }

        function updateGraph(feedData, fieldKey, polyId, dotId) {
            const validData = feedData.filter(d => d[fieldKey] !== null).map(d => parseFloat(d[fieldKey]));
            if (validData.length === 0) return;

            const min = Math.min(...validData);
            const max = Math.max(...validData);
            const range = max - min || 1; 

            const svgWidth = 360;
            const svgHeight = 60; 
            const padding = 8; 
            const drawHeight = svgHeight - (padding * 2);

            let points = [];
            const stepX = svgWidth / Math.max(validData.length - 1, 1);

            validData.forEach((val, index) => {
                const x = index * stepX;
                const y = padding + drawHeight - (((val - min) / range) * drawHeight);
                points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
            });

            document.getElementById(polyId).setAttribute('points', points.join(' '));
            
            const finalY = points[points.length - 1].split(',')[1];
            const dot = document.getElementById(dotId);
            dot.setAttribute('cy', finalY);
            dot.setAttribute('opacity', '1'); 
        }

        function calculateTrendText(feedData, fieldKey, threshold, unit) {
            const validData = feedData.filter(d => d[fieldKey] !== null).map(d => parseFloat(d[fieldKey]));
            if (validData.length < 10) return "FLAT";
            
            const diff = validData[validData.length - 1] - validData[0];
            if (Math.abs(diff) < threshold) return "FLAT";
            return (diff > 0 ? "+" : "") + diff.toFixed(1) + unit;
        }

        function fetchData() {
            const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&minutes=${currentMinutes}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const feeds = data.feeds;
                    if(feeds && feeds.length > 0) {
                        globalFeedData = feeds;
                        const latest = feeds[feeds.length - 1]; 
                        
                        document.getElementById('val-temp').innerText = parseFloat(latest.field1).toFixed(1);
                        document.getElementById('val-hum').innerText = parseFloat(latest.field2).toFixed(1);
                        document.getElementById('val-pres').innerText = parseFloat(latest.field3).toFixed(0);
                        
                        const rawGas = parseFloat(latest.field4);
                        document.getElementById('val-voc').innerText = getGasStatus(rawGas);
                        document.getElementById('val-voc-raw').innerText = `${(rawGas/1000).toFixed(1)}kΩ`;

                        const humCard = document.getElementById('card-hum');
                        if (parseFloat(latest.field2) > 65) humCard.classList.add('alert-warning');
                        else humCard.classList.remove('alert-warning');

                        const vocCard = document.getElementById('card-voc');
                        if (rawGas < 10000) vocCard.classList.add('alert-danger');
                        else vocCard.classList.remove('alert-danger');

                        updateGraph(feeds, 'field1', 'poly-temp', 'dot-temp');
                        updateGraph(feeds, 'field2', 'poly-hum', 'dot-hum');
                        updateGraph(feeds, 'field3', 'poly-pres', 'dot-pres');
                        updateGraph(feeds, 'field4', 'poly-voc', 'dot-voc');

                        document.getElementById('trend-temp').innerText = calculateTrendText(feeds, 'field1', 1.0, '°');
                        document.getElementById('trend-hum').innerText = calculateTrendText(feeds, 'field2', 2.0, '%');
                        document.getElementById('trend-pres').innerText = calculateTrendText(feeds, 'field3', 2.0, '');
                        document.getElementById('trend-voc').innerText = (rawGas - parseFloat(feeds[0].field4) > 5000) ? "IMPROVING" : "STABLE";

                        const date = new Date(latest.created_at);
                        const timeString = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        
                        document.getElementById('last-synced').innerHTML = `INDOOR<br>STUDIO 01 · LAST SYNCED AT ${timeString}`;
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
